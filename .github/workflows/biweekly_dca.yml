name: Weekly DCA Execution & Telegram Notification

on:
  # Runs every Monday at 23:37 UTC (07:37 AM HKT Tuesday, after U.S. Monday close)
  # Adjust to '37 23 * * 5' UTC (07:37 AM HKT Saturday) if you prefer Friday close
  schedule:
    - cron: '00 16 * * 2'

  # Allows one-click manual runs from the GitHub Actions UI at any time
  # (manual runs bypass the bi-weekly skip check)
  workflow_dispatch:

permissions:
  contents: write  # Needed so GitHub Actions can commit updated position.csv / logs back to main

jobs:
  check-biweekly-schedule:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.week_check.outputs.should_run }}
    steps:
      - name: Check Bi-Weekly Schedule Parity
        id: week_check
        run: |
          # Manual workflow_dispatch always runs
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger detected — running DCA."
            exit 0
          fi

          # ISO week number (1..53). Change `== 0` to `== 1` to flip to odd weeks.
          WEEK_NUM=$(date -u +%-V)
          if [ $((WEEK_NUM % 2)) -eq 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "ISO Week $WEEK_NUM is an EVEN week — running bi-weekly DCA."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "ISO Week $WEEK_NUM is an ODD week — skipping this week."
          fi

  run-weekly-dca:
    needs: check-biweekly-schedule
    if: needs.check-biweekly-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v5

      - name: 2. Set Up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install yfinance pandas numpy requests
          fi

      - name: 4. Run Weekly DCA Main Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: 5. Commit Updated Position & Log Files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add position.csv *.csv log/ || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update bi-weekly DCA position & logs ($(date -u +'%Y-%m-%d'))"
            git push
          else
            echo "No changes to position.csv or logs to commit."
          fi
